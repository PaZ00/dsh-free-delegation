# Бандл обязательного делегирования субагентам.
#
# Зачем отдельный Host-плагин, а не текст в persona пресета: мандат обязан
# действовать только у КОРНЕВОГО агента. Дети идут с depth = 1 при хостовом
# maxDepth = 1, то есть делегировать не могут; безусловный приказ «каждый ответ
# обязан содержать вызов subagent» заставлял бы ребёнка пытаться и падать на
# проверке глубины, сжигая ход. Persona пресета — статическая строка и глубину
# не видит; секция systemPrompt с текстом-функцией получает AssembleContext.agent
# и решает по факту.
- insert:
    - id: free-delegation
      name: '@local/dsh-free-delegation'
      config:
        enabled: true
        # ПЕРВЫЙ (дешёвый) исполнитель — по умолчанию для коротких и рутинных задач.
        # Замер 27.11.2026 на короткой задаче: 0.00141 BYN / 20.9 с / 8 запросов
        # против 0.01264 BYN / 67.7 с / 23 запросов у второго маршрута.
        executor:
          provider: aiai-by
          model: solar-mini-4-5
        # ВТОРОЙ исполнитель — только на подъём: сложная логика, зрение,
        # окно больше 524K, нечёткая постановка, зацикливание, два провала дешёвой.
        # Замер на сложной задаче: 0.01682 BYN / 116.5 с / 22 запроса против
        # 0.01708 BYN / 180.4 с / 39 запросов у дешёвой — то есть дешёвая там
        # даже дороже и заметно медленнее, поэтому подъём оправдан не эмоцией,
        # а цифрами. У hy4-flash есть vision (у solar-mini его нет) и окно 1M.
        # Уберите это поле — и мандат вернётся к правилу «РОВНО ОДИН исполнитель».
        escalation:
          provider: aiai-by
          model: hy4-flash
        # Локальные маршруты мандат не получают: роль «Руководитель» и мелкие
        # локальные модели делегируют плохо, а задача бандла — облачный родитель.
        localProviders:
          - ollama-local
          - lmstudio-local
        # Жёсткое правило единственного исполнителя действует ТОЛЬКО в этих
        # режимах (требование пользователя): «стандартный» и «руководитель».
        # В cordis и ptc мандата нет — там снят и agentOptions пресета.
        mandatePresets:
          - standard
          - lead
